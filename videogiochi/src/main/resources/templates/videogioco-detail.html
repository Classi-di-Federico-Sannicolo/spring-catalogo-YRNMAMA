<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Dettaglio Videogioco</title>
</head>
<body>

<div class="container mt-4" style="max-width: 720px;">

    <a th:href="@{/}" class="btn btn-outline-secondary mb-4">
        ← Torna al catalogo
    </a>

    <!-- ALERT -->
    <div th:if="${created}" class="alert alert-success">
        Videogioco creato con successo!
    </div>

    <div th:if="${updated}" class="alert alert-warning">
        Videogioco aggiornato!
    </div>

    <!-- CARD -->
    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="fw-bold mb-3" th:text="${videogioco.titolo}"></h2>

            <span class="badge bg-dark mb-3" th:text="${videogioco.genere}"></span>

            <dl class="row mt-3">
                <dt class="col-sm-4">ID</dt>
                <dd class="col-sm-8" th:text="${videogioco.id}"></dd>

                <dt class="col-sm-4">Produttore</dt>
                <dd class="col-sm-8" th:text="${videogioco.produttore}"></dd>

                <dt class="col-sm-4">Anno</dt>
                <dd class="col-sm-8" th:text="${videogioco.anno}"></dd>
            </dl>

        </div>

        <!-- ACTIONS -->
        <div class="card-footer bg-white border-0 d-flex justify-content-between">

            <a th:href="@{'/item/edit/' + ${videogioco.id}}"
               class="btn btn-outline-warning">
                <i class="bi bi-pencil"></i> Modifica
            </a>

            <a th:href="@{'/item/delete/' + ${videogioco.id}}"
               class="btn btn-outline-danger"
               onclick="return confirm('Sei sicuro?')">
                <i class="bi bi-trash"></i> Elimina
            </a>

        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
