<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <title th:text="${editing} ? 'Modifica Videogioco' : 'Nuovo Videogioco'"></title>
</head>
<body>

<div class="container" style="max-width: 720px; margin-top:50px;">

    <a th:href="@{/}" class="btn btn-outline-primary mb-4">
        ← Torna al catalogo
    </a>

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="mb-4"
                th:text="${editing} ? 'Modifica Videogioco' : 'Aggiungi Videogioco'">
            </h2>

            <!-- FORM -->
            <form method="post"
                  th:action="${editing} ? @{'/item/edit/' + ${videogiocoId}} : @{/new}"
                  th:object="${videogiocoForm}">

                <!-- TITOLO -->
                <div class="mb-3">
                    <label class="form-label">Titolo</label>
                    <input th:field="*{titolo}" type="text" class="form-control">
                    <div th:if="${#fields.hasErrors('titolo')}" class="text-danger">
                        <span th:errors="*{titolo}"></span>
                    </div>
                </div>

                <!-- PRODUTTORE -->
                <div class="mb-3">
                    <label class="form-label">Produttore</label>
                    <input th:field="*{produttore}" type="text" class="form-control">
                    <div th:if="${#fields.hasErrors('produttore')}" class="text-danger">
                        <span th:errors="*{produttore}"></span>
                    </div>
                </div>

                <!-- GENERE -->
                <div class="mb-3">
                    <label class="form-label">Genere</label>
                    <select th:field="*{genere}" class="form-select">
                        <option value="">Seleziona</option>
                        <option value="Azione">Azione</option>
                        <option value="Avventura">Avventura</option>
                        <option value="RPG">RPG</option>
                        <option value="Sport">Sport</option>
                        <option value="Puzzle">Puzzle</option>
                        <option value="Simulazione">Simulazione</option>
                    </select>
                    <div th:if="${#fields.hasErrors('genere')}" class="text-danger">
                        <span th:errors="*{genere}"></span>
                    </div>
                </div>

                <!-- ANNO -->
                <div class="mb-3">
                    <label class="form-label">Anno</label>
                    <input th:field="*{anno}" type="number" class="form-control">
                    <div th:if="${#fields.hasErrors('anno')}" class="text-danger">
                        <span th:errors="*{anno}"></span>
                    </div>
                </div>

                <!-- BUTTON -->
                <button class="btn btn-success w-100">
                    <span th:text="${editing} ? 'Aggiorna' : 'Salva'"></span>
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
