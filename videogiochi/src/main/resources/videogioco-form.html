<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <title>Nuovo Videogioco</title>
</head>
<body>

<div class="container" style="margin-top:50px;">

    <a th:href="@{/}" class="btn btn-primary">Home</a>

    <h2 class="text-center">Nuovo Videogioco</h2>

    <form method="post" th:action="@{/new}" th:object="${videogiocoForm}">

        <div class="mb-3">
            <label>Titolo</label>
            <input th:field="*{titolo}" type="text" class="form-control">

            <div th:if="${#fields.hasErrors('titolo')}">
                <span th:errors="*{titolo}" class="text-danger"></span>
            </div>
        </div>

        <div class="mb-3">
            <label>Genere</label>
            <input th:field="*{genere}" type="text" class="form-control">

            <div th:if="${#fields.hasErrors('genere')}">
                <span th:errors="*{genere}" class="text-danger"></span>
            </div>
        </div>

        <div class="mb-3">
            <label>Anno</label>
            <input th:field="*{anno}" type="number" class="form-control">

            <div th:if="${#fields.hasErrors('anno')}">
                <span th:errors="*{anno}" class="text-danger"></span>
            </div>
        </div>

        <button class="btn btn-success">Salva</button>

    </form>
</div>

</body>
</html>
