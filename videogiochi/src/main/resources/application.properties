server.port=8080

# setup connessione database
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:videogiochi_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# configurazioni per JPA
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=true

# configurazioni del framework (impostazione su redirect)
server.forward-headers-strategy=framework

# RAWG API Configuration
rawg.api.key=a6f4e59c446e4fb4bde9090dbe9bdc51
rawg.api.base-url=https://api.rawg.io/api